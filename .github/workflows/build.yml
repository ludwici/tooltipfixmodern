name: Build Fabric JAR

on:
  push:
    branches:
      - "26.1.2"
  pull_request:
    branches:
      - "26.1.2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 26.1.2 (Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and remap JAR
        run: ./gradlew --no-daemon clean build

      - name: Collect distributable JAR
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one distributable JAR, found %s:\n' "${#jars[@]}"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi
          mkdir -p artifacts
          cp "${jars[0]}" artifacts/
          echo "Built distributable: ${jars[0]}"

      - name: Upload ready-to-install JAR
        uses: actions/upload-artifact@v4
        with:
          name: tooltipfixmodern-fabric-26.1.2
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 30
